name: Build Half Life 2 for iOS 6

on:
  workflow_dispatch:

jobs:
  build-hl2-ios6:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download iOS 6 SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sdks

          SDK_URL="https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.0.sdk.zip"

          curl -fL --retry 3 "$SDK_URL" -o sdks/iPhoneOS6.0.sdk.zip
          unzip -t sdks/iPhoneOS6.0.sdk.zip
          unzip -q sdks/iPhoneOS6.0.sdk.zip -d sdks

          SDK_PATH="$GITHUB_WORKSPACE/sdks/6.0"

          if [ ! -d "$SDK_PATH/System/Library/Frameworks" ]; then
            echo "ERROR: iOS SDK is missing or has an unexpected structure"
            find "$GITHUB_WORKSPACE/sdks" -maxdepth 5 -type d
            exit 1
          fi

          echo "SDK_PATH=$SDK_PATH" >> "$GITHUB_ENV"
          echo "SDK installed at: $SDK_PATH"

      - name: Configure compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "CC=$(xcrun -f clang)" >> "$GITHUB_ENV"
          echo "CXX=$(xcrun -f clang++)" >> "$GITHUB_ENV"

          echo "CFLAGS=-arch armv7 -miphoneos-version-min=6.0 -isysroot $SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-arch armv7 -miphoneos-version-min=6.0 -isysroot $SDK_PATH" >> "$GITHUB_ENV"
          echo "LDFLAGS=-arch armv7 -miphoneos-version-min=6.0 -isysroot $SDK_PATH" >> "$GITHUB_ENV"

          xcrun clang --version
          echo "Using SDK: $SDK_PATH"

      - name: Inspect SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "SDK path: $SDK_PATH"
          ls -la "$SDK_PATH"
          ls -la "$SDK_PATH/System/Library/Frameworks"

      - name: Clean previous build configuration
        shell: bash
        run: |
          set -euo pipefail

          rm -f build/configuration.py
          rm -f build/c4che/_cache.py

      - name: Configure Half-Life 2
        shell: bash
        run: |
          set -o pipefail

          python3 waf configure \
            -T release \
            --ios \
            --togles \
            --build-games=hl2 \
            2>&1 | tee configure.log

      - name: Build Half-Life 2
        shell: bash
        run: |
          set -o pipefail

          python3 waf build -v 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios6-build-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name '*.app' \
            -not -path '*/sdks/*' \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found after build"
            find "$GITHUB_WORKSPACE" -type d -name '*.app' -print
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -qr "$GITHUB_WORKSPACE/hl2-ios6.ipa" Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: half-life-2-ios6-ipa
          path: hl2-ios6.ipa
          if-no-files-found: error
